name: Prisma Migration Check

# Fails when prisma/schema.prisma declares schema that the committed
# migrations do not create. This is the drift that broke production in
# commit 764fc93: projectName was added to the models and queries but no
# migration shipped, so deployed databases threw P2022 ColumnNotFound.

on:
  pull_request:
    paths:
      - "prisma/schema.prisma"
      - "prisma/migrations/**"
      - ".github/workflows/prisma-migration-check.yml"
  push:
    branches: [main]
    paths:
      - "prisma/schema.prisma"
      - "prisma/migrations/**"
      - ".github/workflows/prisma-migration-check.yml"

jobs:
  migration-drift:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shadow?schema=public
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shadow_dev?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check schema matches migrations
        run: |
          echo "Replaying prisma/migrations into the shadow database and"
          echo "comparing the result against prisma/schema.prisma..."
          set +e
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema prisma/schema.prisma \
            --exit-code
          status=$?
          set -e
          if [ "$status" = "2" ]; then
            echo ""
            echo "::error::Schema drift detected. prisma/schema.prisma differs from"
            echo "::error::what the committed migrations produce. Generate a migration"
            echo "::error::before merging:  npx prisma migrate dev --name <describe_change>"
            echo ""
            echo "Drift SQL (migrations -> schema):"
            npx prisma migrate diff \
              --from-migrations prisma/migrations \
              --to-schema prisma/schema.prisma \
              --script || true
            exit 1
          elif [ "$status" != "0" ]; then
            echo "::error::prisma migrate diff failed (exit $status)."
            exit "$status"
          fi
          echo "Schema and migrations are in sync."
