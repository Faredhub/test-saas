services:
  postgres:
    image: postgres:16-alpine
    container_name: tixelerp-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: tixelerp
      POSTGRES_USER: tixelerp
      POSTGRES_PASSWORD: tixelerp_dev_2026
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
