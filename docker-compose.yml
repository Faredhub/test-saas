services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tixelerp-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://tixelerp:${DB_PASSWORD:-tixelerp_prod_2026}@postgres:5432/tixelerp?schema=public
      - REDIS_URL=redis://redis:6379
      - NEXTAUTH_URL=https://trp.tpdemo.in
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-change-me-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: tixelerp-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: tixelerp
      POSTGRES_USER: tixelerp
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tixelerp_prod_2026}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tixelerp -d tixelerp"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tixelerp-redis
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
